<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6fa">
<title>Tracker Produktivitas Harian</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){var m='auto';try{m=localStorage.getItem('tracker-theme')||'auto'}catch(e){}
var d=m==='dark'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light')})();
</script>
<style>
:root{--navy:#1f3f73;--blue:#5b7fb8;--soft:#dce6f4;--softer:#eef3fa;--bg:#f4f6fa;--card:#fff;--line:#e3e8f0;--text:#22324d;--mute:#7a879c;--ink:#1f3f73;--inp:#fff;--good:#2f8f5b;--bad:#c2453d;--warn:#d08a1f}
:root[data-theme=dark]{color-scheme:dark;--navy:#4a7bd0;--blue:#6f94d6;--soft:#26334d;--softer:#1f2a40;--bg:#0d1320;--card:#161e2e;--line:#2a3550;--text:#e4e9f3;--mute:#8d9ab3;--ink:#a9c6f5;--inp:#0f1626;--good:#4cb883;--bad:#e5645c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.wrap{max-width:1100px;margin:auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:14px}
h1{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-1px;line-height:1}
h1 span{font-weight:400;font-size:17px;letter-spacing:0;margin-left:8px}
.tag{color:var(--mute);font-size:13px;margin-top:6px}
.sync{font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;scrollbar-width:none}
nav button{flex:1;min-width:max-content;border:0;background:none;padding:9px 14px;border-radius:8px;font:inherit;font-weight:500;color:var(--mute);cursor:pointer}
nav button.on{background:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:12px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--mute)}
.g{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.stat small{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--mute);text-transform:uppercase}
.stat b{display:block;font-size:22px;margin:4px 0 8px;color:var(--ink)}
.bar{height:5px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);transition:width .3s}
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.datenav b{font-size:16px;min-width:200px;text-align:center}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{background:none;color:var(--bad);border:0;padding:2px 6px}
.list label{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.list label:last-child{border-bottom:0}
.list label.done span{text-decoration:line-through;color:var(--mute)}
input[type=checkbox]{accent-color:var(--ink);width:17px;height:17px;flex:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:13px;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--inp)}
textarea{width:100%;resize:vertical;min-height:64px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:500}
.water{display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap}
.cup{width:24px;height:32px;border:2px solid var(--blue);border-top:0;border-radius:0 0 6px 6px;cursor:pointer;position:relative;overflow:hidden}
.cup.on::after{content:"";position:absolute;inset:28% 0 0;background:var(--blue)}
.pomo{text-align:center}
.ring{width:150px;height:150px;margin:6px auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
.ring b{font-size:30px;color:var(--ink)}.ring small{font-size:11px;color:var(--mute);letter-spacing:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 11px;font:inherit;font-size:12px;cursor:pointer;color:var(--text)}
.seg button.on{background:var(--soft);color:var(--ink);font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}.dots i{width:13px;height:13px;border-radius:50%;background:var(--soft)}.dots i.on{background:var(--blue)}
.scale{display:flex;gap:6px}.scale button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.scale button.on{background:var(--navy);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.hgrid th,.hgrid td{text-align:center}.hgrid td:first-child,.hgrid th:first-child{text-align:left}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--blue);display:inline-block;cursor:pointer;vertical-align:middle}.dot.on{background:var(--blue)}.dot.today{box-shadow:0 0 0 3px var(--soft)}
.goal{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:40px 1fr;gap:6px 10px;align-items:center}
.goal b{font-size:20px;color:var(--ink);grid-row:span 2}
.goal input,.goal select{width:100%}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{border-radius:10px;padding:12px}.q h3{font-size:11px;letter-spacing:.8px;margin-bottom:6px}
.q1{background:var(--navy);color:#fff}.q2{background:var(--blue);color:#fff}.q3,.q4{background:var(--soft)}
.q textarea{background:transparent;border:0;color:inherit;min-height:90px;padding:0;outline:none}
.q1 textarea::placeholder,.q2 textarea::placeholder{color:#dfe7f3}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600;background:var(--soft);color:var(--ink)}
.muted{color:var(--mute);font-size:12px}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.hbars .r{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.hbars .t{height:12px;background:var(--softer);border-radius:6px;overflow:hidden}.hbars .t i{display:block;height:100%;background:var(--blue);border-radius:6px}
.hbars .t i.over{background:var(--bad)}
.quote{font-size:13px;font-style:italic;color:var(--mute);text-align:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.empty{color:var(--mute);font-size:13px;padding:10px 0}
.chart{width:100%;height:auto;display:block}
.info p{margin-bottom:8px;line-height:1.5;font-size:13px}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}h1{font-size:28px}.hbars .r{grid-template-columns:100px 1fr 60px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>HARIAN<span>Tracker Produktivitas</span></h1><p class="tag">Rencanakan dengan niat. Fokus dengan tujuan. Capai targetmu.</p></div>
  <div class="row"><div class="seg" id="theme" title="Tampilan"><button data-theme="auto">Auto</button><button data-theme="light">☀ Terang</button><button data-theme="dark">🌙 Gelap</button></div><div class="sync" id="sync">Memuat…</div></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ====== Data & storage ======
const LKEY='tracker-app-v4';
const TASKS=["05:00 Bangun tanpa snooze + rapikan kasur","Minum air dulu, HP mode pesawat sampai 07:00","Meditasi / napas dalam 10 menit","Olahraga 30 menit + sinar matahari pagi","Tulis 3 prioritas hari ini","Deep work 1 jam tanpa HP","Baca 10 halaman","Radar sosial: dengar > bicara, tanya 'siapa untung?'","Catat pengeluaran hari ini","Malam: 1 pelajaran + 1 syukur, tidur 7–8 jam"];
const HABITS=["Bangun 05:00","Pagi tanpa HP","Olahraga","Deep work 1 jam","Baca 10 halaman","Tanpa gula / junk food","Tidur 7–8 jam"];
const KAT_UANG=["Makan & minum","Transport","Belanja","Tagihan","Hiburan","Kesehatan","Belajar","Lainnya"];
const KAT_WAKTU=["Rutinitas pagi","Olahraga","Perencanaan","Deep Work","Kerja","Admin","Belajar","Istirahat","Pribadi"];
const SCHED=[["05:00","05:20","Bangun tanpa snooze, minum air, meditasi","Rutinitas pagi"],["05:20","05:50","Olahraga + sinar matahari pagi","Olahraga"],["05:50","06:20","Mandi & siap-siap","Pribadi"],["06:20","07:00","Jurnal & tulis 3 prioritas","Perencanaan"],["07:00","08:00","Deep work 1 jam (HP mode pesawat)","Deep Work"],["08:00","12:00","Kerja / aktivitas utama","Kerja"],["12:00","13:00","Istirahat & makan siang","Istirahat"],["13:00","15:00","Deep work sesi 2","Deep Work"],["15:00","16:00","Admin & balas pesan","Admin"],["16:00","17:00","Belajar materi minggu ini","Belajar"],["17:00","18:00","Jalan sore / istirahat","Istirahat"],["18:00","20:00","Waktu pribadi & keluarga","Pribadi"],["20:00","20:30","Baca 10 halaman","Belajar"],["20:30","21:00","Catat pengeluaran, jurnal malam, rencana besok","Perencanaan"],["21:00","22:00","Wind down, HP off, siap tidur","Istirahat"]];
const STAGE2=["Mandi air dingin","Makan protein & makanan utuh, makan pelan","Jalan 10.000 langkah / waktu di alam","Stretching & jaga postur","Belajar masak","Puasa sesekali","Senyum & peluk orang terdekat","Baca biografi, dengar podcast","Rapikan kamar, jaga kebersihan diri"];
function fresh(){return{v:4,updatedAt:0,tasks:[...TASKS],habits:[...HABITS],days:{},
 schedule:SCHED.map(([s,e,a,k])=>({s,e,a,k})),expenses:[],income:{},budget:{},
 goals:[["Rutinitas 5 AM minimal 5x seminggu","Pasang alarm 04:55 & taruh HP jauh dari kasur"],["Kenali manipulasi: jangan putuskan saat emosi/FOMO","Tunda keputusan besar 24 jam"],["Sebelum negosiasi: tahu mau apa & batas mundur","Tulis tujuan + batas sebelum ngobrol"],["Jaga energi & uang: berani bilang 'tidak', belanja < pemasukan","Isi budget di tab Keuangan"]].map(([t,n])=>({t,n,st:"Belum mulai"})),
 matrix:{m1:"• Rutinitas pagi 5 AM\n• Deep work 1 jam",m2:"• Pelajari 1 materi/minggu: negosiasi → anti-manipulasi → street smart\n• Pakai checklist negosiasi sebelum minta sesuatu\n• Belajar literasi keuangan dasar",m3:"• Detail teori: simpan, nggak perlu dihafal\n• Rangkum materi baru ke AI",m4:"• Scroll sosmed & konten motivasi baru\n• Gula, junk food\n• Hype/FOMO saham & crypto\n• Drama & orang yang menguras energi"},
 stage2:STAGE2.map(t=>({t,w:"",d:false})),reviews:{},notes:""}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function normalize(o){const f=fresh();o=Object.assign(f,o||{});for(const k of ['days','income','budget','reviews','matrix'])if(typeof o[k]!=='object'||!o[k])o[k]=f[k];
 for(const k of ['tasks','habits','schedule','expenses','goals','stage2'])if(!Array.isArray(o[k]))o[k]=f[k];return o}
function saveLocal(){ls(LKEY,JSON.stringify(S))}

// ====== Helpers ======
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const parseKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const fmtDate=(k,o={weekday:'long',day:'numeric',month:'long',year:'numeric'})=>parseKey(k).toLocaleDateString('id-ID',o);
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const monthOf=k=>k.slice(0,7);
function day(k){if(!S.days[k])S.days[k]={t:[],h:[],sc:[],water:0,pomo:0,sleep:'',wake:'',mood:0,energy:0,lesson:'',grateful:''};return S.days[k]}
const peek=k=>S.days[k];
function sleepDur(d){if(!d||!d.sleep||!d.wake)return null;const[a,b]=d.sleep.split(':').map(Number),[c,e]=d.wake.split(':').map(Number);let m=(c*60+e)-(a*60+b);if(m<=0)m+=1440;return m/60}
function cnt(arr,n){let c=0;for(let i=0;i<n;i++)if(arr&&arr[i])c++;return c}
function score(k){const d=peek(k);if(!d)return 0;const nt=S.tasks.length||1,nh=S.habits.length||1,sd=sleepDur(d);
 return cnt(d.t,S.tasks.length)/nt*.4+cnt(d.h,S.habits.length)/nh*.2+Math.min(d.pomo/8,1)*.2+Math.min(d.water/8,1)*.1+(sd?Math.min(sd/7,1):0)*.1}
const weekStart=k=>{const d=parseKey(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return keyOf(d)};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

let S;
(function load(){let raw=ls(LKEY);if(raw){try{S=normalize(JSON.parse(raw));return}catch(e){}}
 S=fresh();
 try{const o=JSON.parse(ls('tracker-harian-v3')||'null');if(o){const d=day(todayKey());
  if(Array.isArray(o.goals))o.goals.forEach((g,i)=>{if(g&&S.goals[i])S.goals[i].t=g});
  if(o.text){for(const k of['m1','m2','m3','m4'])if(o.text[k])S.matrix[k]=o.text[k];if(o.text.notes)S.notes=o.text.notes}
  d.water=o.water||0;d.pomo=o.pomo||0;
  if(Array.isArray(o.tasks))o.tasks.forEach(t=>{const i=S.tasks.findIndex(n=>n.split(' ')[0]===String(t[0]).split(' ')[0]);if(i>=0&&t[1])d.t[i]=true});
  S.updatedAt=Date.now()}}catch(e){}})();

// ====== Sync ======
let ref=null,pushTimer=null,writing=false,again=false;
function setSync(t){$('sync').textContent=t}
function save(){S.updatedAt=Date.now();saveLocal();if(ref){setSync('Menyimpan…');clearTimeout(pushTimer);pushTimer=setTimeout(push,1500)}}
async function push(){if(!ref)return;if(writing){again=true;return}writing=true;
 try{await ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt});setSync('☁ Tersimpan di akunmu')}catch(e){setSync(e&&e.code==='quota_exceeded'?'Penyimpanan penuh':'Tersimpan di browser ini')}
 writing=false;if(again){again=false;push()}}
async function pull(){if(!ref)return;try{const snap=await ref.get();if(snap.exists){const r=snap.data();
  if((r.updatedAt||0)>(S.updatedAt||0)){S=normalize(JSON.parse(r.json));saveLocal();render()}else if((S.updatedAt||0)>(r.updatedAt||0))push()}
  else if(S.updatedAt)push();setSync('☁ Tersimpan di akunmu')}catch(e){setSync('Tersimpan di browser ini')}}
(async()=>{setSync('Tersimpan di browser ini');if(!window.claude||!claude.use)return;
 try{const [u,db]=await Promise.all([claude.use('user'),claude.use('db')]);if(!u||!db)return;const id=await u.id();if(!id)return;
  ref=db.collection('data/users/'+id).doc('tracker');setSync('Menyinkronkan…');
  const to=setTimeout(()=>setSync('Belum terhubung, data aman di browser ini'),10000);await pull();clearTimeout(to)}catch(e){}})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});

// ====== UI state ======
let tab='hari',sel=todayKey(),wk=weekStart(todayKey()),range=7,month=monthOf(todayKey());
const TABS=[['hari','Hari Ini'],['habit','Habit'],['jadwal','Jadwal'],['uang','Keuangan'],['stat','Statistik'],['target','Target'],['lain','Lainnya']];
function nav(){$('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-tab="${k}">${l}</button>`).join('')}
$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();window.scrollTo(0,0)}};
function render(){nav();$('main').innerHTML=({hari:vHari,habit:vHabit,jadwal:vJadwal,uang:vUang,stat:vStat,target:vTarget,lain:vLain})[tab]();after()}
function after(){if(tab==='hari')drawPomo()}

// ====== Pomodoro ======
let pm={mode:25,left:1500,timer:null};
const PL={25:'FOKUS',5:'ISTIRAHAT',15:'ISTIRAHAT PANJANG'};
let actx=null;function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+1);o.start();o.stop(actx.currentTime+1)}catch(e){}}
function drawPomo(){const t=$('tm');if(!t)return;t.textContent=pad(Math.floor(pm.left/60))+':'+pad(pm.left%60);
 $('arc').style.strokeDashoffset=414.7*(1-pm.left/(pm.mode*60));$('tmL').textContent=PL[pm.mode];$('go').textContent=pm.timer?'❚❚ Jeda':'▶ Mulai';
 document.querySelectorAll('[data-pm]').forEach(b=>b.classList.toggle('on',+b.dataset.pm===pm.mode))}
function pmStart(){if(pm.timer){clearInterval(pm.timer);pm.timer=null;drawPomo();return}
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 pm.timer=setInterval(()=>{pm.left--;if(pm.left<=0){clearInterval(pm.timer);pm.timer=null;beep();
  if(pm.mode===25){day(todayKey()).pomo++;save();toast('Sesi fokus selesai! +1 pomodoro');pm.mode=5}else{toast('Istirahat selesai, lanjut fokus');pm.mode=25}
  pm.left=pm.mode*60;if(tab==='hari'){render();return}}drawPomo()},1000);drawPomo()}

// ====== Views ======
function kpi(l,v,p){return `<div class="card stat"><small>${l}</small><b>${v}</b><div class="bar"><i style="width:${Math.max(0,Math.min(1,p))*100}%"></i></div></div>`}
function vHari(){const d=day(sel),nt=S.tasks.length,dn=cnt(d.t,nt),sd=sleepDur(d),isToday=sel===todayKey();
 return `<div class="datenav"><button class="btn ghost sm" data-act="prev">‹</button><b>${fmtDate(sel)}</b><button class="btn ghost sm" data-act="next">›</button>${isToday?'':'<button class="btn sm" data-act="today">Hari ini</button>'}</div>
 <div class="g g4" style="margin-bottom:16px">${kpi('Tugas selesai',dn+'/'+nt,dn/(nt||1))}${kpi('Waktu fokus',Math.floor(d.pomo*25/60)+'j '+(d.pomo*25%60)+'m',d.pomo/8)}${kpi('Minum air',d.water+'/8 gelas',d.water/8)}${kpi('Skor produktivitas',Math.round(score(sel)*100)+'%',score(sel))}</div>
 <div class="g g3">
 <div class="stack">
  <div class="card"><h2>Checklist hari ini <small>${dn}/${nt}</small></h2><div class="list">${S.tasks.map((t,i)=>`<label class="${d.t[i]?'done':''}"><input type="checkbox" data-t="${i}" ${d.t[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')||'<p class="empty">Belum ada tugas. Tambahkan di tab Lainnya.</p>'}</div></div>
 </div>
 <div class="stack">
  <div class="card pomo"><h2>Pomodoro <small>${d.pomo} sesi${isToday?'':' (tanggal ini)'}</small></h2>
   <div class="seg">${[25,5,15].map(m=>`<button data-pm="${m}">${m===25?'Fokus 25':m===5?'Istirahat 5':'Panjang 15'}</button>`).join('')}</div>
   <div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="66" stroke="var(--soft)" stroke-width="9" fill="none"/><circle id="arc" cx="75" cy="75" r="66" stroke="var(--ink)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="414.7"/></svg><div><b id="tm">25:00</b><small id="tmL">FOKUS</small></div></div>
   <div class="row" style="justify-content:center"><button class="btn" id="go" data-act="pm">▶ Mulai</button><button class="btn ghost" data-act="pmreset">Reset</button></div>

function vHabit(){const days=Array.from({length:7},(_,i)=>addDays(wk,i)),tk=todayKey(),end=addDays(wk,6);

function vJadwal(){const d=day(sel);const hrs=r=>{if(!r.s||!r.e)return 0;const[a,b]=r.s.split(':').map(Number),[c,e]=r.e.split(':').map(Number);let m=(c*60+e)-(a*60+b);if(m<0)m+=1440;return m/60};
 const tot={};S.schedule.forEach(r=>{if(r.k)tot[r.k]=(tot[r.k]||0)+hrs(r)});const all=Object.values(tot).reduce((a,b)=>a+b,0)||1;const mx=Math.max(1,...Object.values(tot));

function lineChart(pts,{fmt=v=>Math.round(v*100)+'%',max=1}={}){const W=640,H=220,l=44,r=16,t=16,b=30,w=W-l-r,h=H-t-b,n=pts.length;
 const x=i=>l+(n>1?i*w/(n-1):w/2),y=v=>t+h-h*Math.min(1,Math.max(0,v/max));let g='';
 for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fmt(v)}</text>`}
 const every=Math.ceil(n/8);pts.forEach((p,i)=>{if(i%every===0||i===n-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${p.l}</text>`});
 const ok=pts.map((p,i)=>[p,i]).filter(([p])=>p.v!=null);const d=ok.map(([p,i],k)=>(k?'L':'M')+x(i)+' '+y(p.v)).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>${ok.map(([p,i])=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--ink)"><title>${p.l}: ${fmt(p.v)}</title></circle>`).join('')}</svg>`}

 <div class="g g2"><div class="card"><h2>Skor produktivitas harian</h2>${lineChart(ks.map(k=>({l:lbl(k),v:score(k)})))}</div>
 <div class="card"><h2>Durasi tidur (jam)</h2>${lineChart(ks.map(k=>({l:lbl(k),v:sleepDur(peek(k))})),{fmt:v=>(Math.round(v*10)/10).toString().replace('.',','),max:10})}</div>

 if(el.dataset.w!==undefined){const d=day(sel),i=+el.dataset.w;d.water=(i===d.water-1)?i:i+1;save();render();return}
 if(el.dataset.sc){const d=day(sel),k=el.dataset.sc,v=+el.dataset.v;d[k]=d[k]===v?0:v;save();render();return}
 if(el.dataset.pm){if(pm.timer){clearInterval(pm.timer);pm.timer=null}pm.mode=+el.dataset.pm;pm.left=pm.mode*60;drawPomo();return}
 if(el.dataset.hd){const d=day(el.dataset.hd),i=+el.dataset.hi;d.h[i]=!d.h[i];save();render();return}
 if(el.dataset.td){const d=day(el.dataset.td),i=+el.dataset.ti;d.t[i]=!d.t[i];save();render();return}
 if(el.dataset.range){range=+el.dataset.range;render();return}
 if(el.dataset.delSch!==undefined){const i=+el.dataset.delSch;S.schedule.splice(i,1);Object.values(S.days).forEach(d=>d.sc&&d.sc.splice(i,1));save();render();return}
 if(el.dataset.delEx){S.expenses=S.expenses.filter(x=>x.id!==el.dataset.delEx);save();render();return}
 if(!a)return;
 if(a==='prev'){sel=addDays(sel,-1);render()}else if(a==='next'){sel=addDays(sel,1);render()}else if(a==='today'){sel=todayKey();render()}
 else if(a==='wprev'){wk=addDays(wk,-7);render()}else if(a==='wnext'){wk=addDays(wk,7);render()}else if(a==='wtoday'){wk=weekStart(todayKey());render()}
 else if(a==='mprev'||a==='mnext'){const d=new Date(month+'-01T00:00');d.setMonth(d.getMonth()+(a==='mprev'?-1:1));month=keyOf(d).slice(0,7);render()}
 else if(a==='pm')pmStart();else if(a==='pmreset'){if(pm.timer){clearInterval(pm.timer);pm.timer=null}pm.left=pm.mode*60;drawPomo()}
 else if(a==='pm+'||a==='pm-'){const d=day(sel);d.pomo=Math.max(0,d.pomo+(a==='pm+'?1:-1));save();render()}
 else if(a==='addsch'){S.schedule.push({s:'',e:'',a:'',k:'Kerja'});save();render()}
 else if(a==='sortsch'){const keep=S.schedule.map((r,i)=>[r,i]).sort((x,y)=>(x[0].s||'99').localeCompare(y[0].s||'99'));S.schedule=keep.map(x=>x[0]);Object.values(S.days).forEach(d=>{if(d.sc)d.sc=keep.map(x=>d.sc[x[1]])});save();render()}
 else if(a==='savelists'){const t=$('edT').value.split('\n').map(s=>s.trim()).filter(Boolean),h=$('edH').value.split('\n').map(s=>s.trim()).filter(Boolean);if(t.length)S.tasks=t;if(h.length)S.habits=h;save();toast('Daftar disimpan');render()}
 else if(a==='copyjson'){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Cadangan disalin. Simpan di catatan/email kamu.'),()=>toast('Gagal menyalin'))}
 else if(a==='restore'){try{const o=JSON.parse($('restore').value);if(!o||typeof o!=='object'||!o.days)throw 0;S=normalize(o);save();toast('Data dipulihkan');render()}catch(x){$('rmsg').textContent='Teks cadangan tidak valid.'}}
 else if(a==='xlsx')exportXlsx()});
M.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.t!==undefined){day(sel).t[+el.dataset.t]=el.checked;save();render()}
 else if(el.dataset.h!==undefined){day(sel).h[+el.dataset.h]=el.checked;save();render()}
 else if(el.dataset.scDone!==undefined){day(sel).sc[+el.dataset.scDone]=el.checked;save();render()}
 else if(el.dataset.f==='sleep'||el.dataset.f==='wake'){day(sel)[el.dataset.f]=el.value;save();render()}
 else if(el.dataset.sch!==undefined){S.schedule[+el.dataset.sch][el.dataset.k]=el.value;save();if(el.dataset.k!=='a')render()}
 else if(el.dataset.inc!==undefined){S.income[month]=+el.value||0;save();render()}
 else if(el.dataset.bud!==undefined){S.budget[el.dataset.bud]=+el.value||0;save();render()}
 else if(el.dataset.g!==undefined){S.goals[+el.dataset.g][el.dataset.k]=el.value;save()}
 else if(el.dataset.s2!==undefined){S.stage2[+el.dataset.s2].w=el.value;save()}
 else if(el.dataset.s2d!==undefined){S.stage2[+el.dataset.s2d].d=el.checked;save()}});
M.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.f==='lesson'||el.dataset.f==='grateful'){day(sel)[el.dataset.f]=el.value;save()}
 else if(el.dataset.m){S.matrix[el.dataset.m]=el.value;save()}
 else if(el.dataset.notes!==undefined){S.notes=el.value;save()}
 else if(el.dataset.rv){const ws=weekStart(todayKey());(S.reviews[ws]=S.reviews[ws]||{})[el.dataset.rv]=el.value;save()}});
M.addEventListener('submit',e=>{if(e.target.id!=='exf')return;e.preventDefault();const f=new FormData(e.target),a=+f.get('a');if(!(a>0))return;
 S.expenses.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:f.get('d'),c:f.get('c'),n:String(f.get('n')||'').trim(),a});
 month=monthOf(f.get('d'));save();toast('Pengeluaran dicatat');render()});

// ====== Excel export ======
function loadXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function exportXlsx(){const btn=$('xbtn');let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
 if(!dl)dl={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}};
 btn.disabled=true;btn.textContent='Menyiapkan…';
 try{await loadXLSX();const X=XLSX,wb=X.utils.book_new();
  const keys=Object.keys(S.days).sort();const ds=k=>parseKey(k);
  const add=(name,aoa,cols)=>{const ws=X.utils.aoa_to_sheet(aoa,{cellDates:true});ws['!cols']=cols.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,name)};
  const tk=todayKey(),last30=Array.from({length:30},(_,i)=>addDays(tk,i-29)),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  add('Ringkasan',[['Tracker Produktivitas — ekspor '+fmtDate(tk)],[],['30 hari terakhir',''],['Rata-rata skor',avg(last30.map(score))],['% checklist',avg(last30.map(k=>cnt(peek(k)?.t,S.tasks.length)/(S.tasks.length||1)))],['% habit',avg(last30.map(k=>cnt(peek(k)?.h,S.habits.length)/(S.habits.length||1)))],['Menit fokus',last30.reduce((a,k)=>a+(peek(k)?.pomo||0)*25,0)],['Rata tidur (jam)',avg(last30.map(k=>sleepDur(peek(k))).filter(v=>v))],['Rata mood (1–5)',avg(last30.map(k=>peek(k)?.mood).filter(v=>v))]],[24,16]);
  add('Log Harian',[['Tanggal','Jam tidur','Jam bangun','Durasi tidur (jam)','Gelas air','Sesi pomodoro','Menit fokus','Tugas selesai','Habit selesai','Mood','Energi','Pengeluaran','Skor','Pelajaran','Syukur'],
   ...keys.map(k=>{const d=S.days[k],sd=sleepDur(d);return[ds(k),d.sleep,d.wake,sd?Math.round(sd*10)/10:'',d.water,d.pomo,d.pomo*25,cnt(d.t,S.tasks.length),cnt(d.h,S.habits.length),d.mood||'',d.energy||'',S.expenses.filter(e=>e.d===k).reduce((a,e)=>a+e.a,0),Math.round(score(k)*100)/100,d.lesson,d.grateful]})],[12,9,9,10,8,9,9,10,10,6,6,12,7,36,30]);
  add('Checklist',[['Tanggal',...S.tasks,'Total'],...keys.map(k=>[ds(k),...S.tasks.map((_,i)=>S.days[k].t[i]?'✓':''),cnt(S.days[k].t,S.tasks.length)])],[12,...S.tasks.map(()=>14),7]);
  add('Habit',[['Tanggal',...S.habits,'Total'],...keys.map(k=>[ds(k),...S.habits.map((_,i)=>S.days[k].h[i]?'✓':''),cnt(S.days[k].h,S.habits.length)])],[12,...S.habits.map(()=>14),7]);
  add('Keuangan',[['Tanggal','Kategori','Keterangan','Jumlah'],...[...S.expenses].sort((a,b)=>a.d.localeCompare(b.d)).map(e=>[ds(e.d),e.c,e.n,e.a]),[],['Bulan','Pemasukan'],...Object.entries(S.income).sort().map(([m,v])=>[m,v]),[],['Kategori','Budget/bulan'],...KAT_UANG.map(k=>[k,+S.budget[k]||0])],[12,16,30,14]);
  add('Jadwal',[['Mulai','Selesai','Aktivitas','Kategori'],...S.schedule.map(r=>[r.s,r.e,r.a,r.k])],[8,8,44,16]);
  add('Target & Prioritas',[['No','Target','Status','Langkah berikutnya'],...S.goals.map((g,i)=>['0'+(i+1),g.t,g.st,g.n]),[],['Kuadran','Isi'],['1 · Kerjakan',S.matrix.m1],['2 · Jadwalkan',S.matrix.m2],['3 · Delegasikan',S.matrix.m3],['4 · Hapus',S.matrix.m4],[],['Catatan',S.notes]],[16,60,14,40]);
  add('Review Mingguan',[['Minggu mulai','Yang berhasil','Yang perlu diperbaiki','Fokus minggu depan'],...Object.entries(S.reviews).sort().map(([k,r])=>[ds(k),r.good||'',r.bad||'',r.next||''])],[14,40,40,40]);
  add('Tahap 2',[['Kebiasaan','Mulai','Sudah jalan'],...S.stage2.map(s=>[s.t,s.w,s.d?'✓':''])],[44,12,12]);
  const out=X.write(wb,{bookType:'xlsx',type:'array',cellDates:true});
  await dl.save({filename:'Tracker_Produktivitas_'+tk+'.xlsx',data:new Blob([out])});toast('File Excel tersimpan')}
 catch(e){toast(e&&e.code==='declined'?'Unduhan dibatalkan':'Gagal membuat file Excel')}
 finally{const b=$('xbtn');if(b){b.disabled=false;b.textContent='⬇ Unduh Excel (.xlsx)'}}}


// ====== Tema ======
function themeMode(){return ls('tracker-theme')||'auto'}
function applyTheme(){const m=themeMode(),mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
 const dark=m==='dark'||(m==='auto'&&mq&&mq.matches);document.documentElement.setAttribute('data-theme',dark?'dark':'light');
 const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=dark?'#0d1320':'#f4f6fa';
 document.querySelectorAll('#theme [data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===m))}
$('theme').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(b){ls('tracker-theme',b.dataset.theme);applyTheme()}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
applyTheme();

render();
</script>
